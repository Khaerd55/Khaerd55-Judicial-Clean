name: Build Windows Setup
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check JavaScript syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer.js
          node --check detention-register.js
          node --check detention-ui.js
          node --check legacy-data-migration.js
      - name: Install locked dependencies
        run: npm ci
      - name: Test detention report data handling
        run: node --test tests/detention.test.js tests/migration.test.js
      - name: Validate PowerShell on Windows PowerShell 5
        shell: powershell
        run: |
          $tokens=$null
          $issues=$null
          $null=[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path detention-word.ps1).Path,[ref]$tokens,[ref]$issues)
          if($issues.Count -gt 0){ $issues | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
      - name: Test detention Word output
        shell: pwsh
        run: ./tests/detention-word.test.ps1
      - name: Build NSIS installer
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Judicial-Clean-Setup-5.12.2-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
